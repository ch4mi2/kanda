name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No VITE_TILE_MODE/VITE_TEXTURE_MODE set: build uses their defaults
      # (remote terrain tiles from AWS Open Data, texture off) so this deploy
      # needs no object storage. Switch to pmtiles once terrain.pmtiles +
      # texture.pmtiles are hosted somewhere with HTTP range support (R2 etc.)
      # — see CLAUDE.md "Tiles in production".
      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
