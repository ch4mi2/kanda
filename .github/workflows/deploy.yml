name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Terrain source. With the repo variable TILE_BASE_URL set (the public
      # origin of the R2 bucket holding terrain.pmtiles, no trailing slash) the
      # build serves the Copernicus archive from there. Unset, it falls back to
      # remote tiles from AWS Open Data (SRTM) - see CLAUDE.md "Tiles in
      # production".
      - name: Build
        env:
          TILE_BASE_URL: ${{ vars.TILE_BASE_URL }}
        run: |
          if [ -n "$TILE_BASE_URL" ]; then
            export VITE_TILE_MODE=pmtiles VITE_TILE_BASE_URL="$TILE_BASE_URL"
          fi
          npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action's default fallback (3.x) doesn't support an
          # assets-only Worker with no `main` field; that landed in Wrangler 4.
          wranglerVersion: "4"
          command: deploy
